                { from: 136, to: 34, type: "feeds_into", label: "visualizes" }, // Systems Mapping → Process Map
                { from: 137, to: 93, type: "feeds_into", label: "creates" },   // Stakeholder Mapping → Stakeholder Engagement
                { from: 138, to: 137, type: "feeds_into", label: "informs" },  // Power Mapping → Stakeholder Mapping
                { from: 143, to: 127, type: "feeds_into", label: "studies" },  // Ethnographic Studies → Culture Framework

                // ========== SECTOR-SPECIFIC: PUBLIC SECTOR ==========
                { from: 154, to: 148, type: "related_to", label: "" },         // Briefing Paper ↔ Executive Briefing Book
                { from: 155, to: 20, type: "feeds_into", label: "guides" },    // Policy Guidance → Policy Framework
                { from: 156, to: 8, type: "depends_on", label: "authorizes" }, // Legislative Mandate → Strategic Plan
                { from: 157, to: 156, type: "feeds_into", label: "implements" }, // Legislative Agenda → Legislative Mandate
                { from: 158, to: 110, type: "related_to", label: "" },         // Statutory Report ↔ Annual Report
                { from: 159, to: 20, type: "feeds_into", label: "creates" },   // Rulemaking Plan → Policy Framework
                { from: 160, to: 20, type: "feeds_into", label: "interprets" }, // Policy Bulletins → Policy Framework
                { from: 161, to: 174, type: "related_to", label: "" },         // Interagency Agreement ↔ Network Governance
                { from: 162, to: 72, type: "feeds_into", label: "part of" },   // Public Data Policies → Data Governance
                { from: 163, to: 110, type: "related_to", label: "" },         // Transparency Report ↔ Annual Report
                { from: 164, to: 33, type: "feeds_into", label: "ensures" },   // Accessibility Plan → Service Catalog
                { from: 165, to: 28, type: "related_to", label: "" },          // Records Retention ↔ Document Retention
                { from: 166, to: 84, type: "related_to", label: "" },          // Continuity of Government ↔ COOP Plan

                // ========== SECTOR-SPECIFIC: NONPROFIT ==========
                { from: 167, to: 168, type: "feeds_into", label: "supports" }, // Case for Support → Fundraising Strategy
                { from: 168, to: 65, type: "feeds_into", label: "funds" },     // Fundraising Strategy → Annual Budget
                { from: 169, to: 168, type: "feeds_into", label: "informs" },  // Donor Segmentation → Fundraising Strategy
                { from: 170, to: 51, type: "feeds_into", label: "manages" },   // Volunteer Handbook → Workforce Plan
                { from: 171, to: 110, type: "related_to", label: "" },         // Impact Report ↔ Annual Report
                { from: 172, to: 112, type: "related_to", label: "" },         // SROI Framework ↔ Impact Measurement
                { from: 173, to: 174, type: "feeds_into", label: "enables" },  // Partner Value Proposition → Network Governance
                { from: 175, to: 174, type: "feeds_into", label: "formalizes" }, // Coalition Agreements → Network Governance

                // ========== SPECIALIZED: CONSULTING & ADVANCED ==========
                { from: 177, to: 8, type: "feeds_into", label: "informs" },    // Product Strategy → Strategic Plan
                { from: 178, to: 31, type: "related_to", label: "" },          // Operating Model Blueprint ↔ Operating Model
                { from: 180, to: 14, type: "feeds_into", label: "ensures" },   // Integrity Framework → Ethics Policy
                { from: 181, to: 115, type: "feeds_into", label: "guides" },   // Delivery Framework → Project Plan
                { from: 182, to: 114, type: "related_to", label: "" },         // Statement of Work ↔ Project Charter
                { from: 183, to: 8, type: "feeds_into", label: "assesses" },   // Diagnostic Toolkit → Strategic Plan
                { from: 184, to: 122, type: "related_to", label: "" },         // Readiness Assessment ↔ Change Readiness
                { from: 185, to: 134, type: "feeds_into", label: "structures" }, // Hypothesis Tree → SWOT Analysis
                { from: 186, to: 181, type: "feeds_into", label: "documents" }, // Blueprint Deck → Delivery Framework
                { from: 187, to: 186, type: "feeds_into", label: "informs" },  // Insights Deck → Blueprint Deck
                { from: 188, to: 32, type: "feeds_into", label: "assesses" },  // Capability Heatmap → Capability Model

                // ========== CROSS-FUNCTIONAL & INTEGRATIVE RELATIONSHIPS ==========
                { from: 43, to: 59, type: "feeds_into", label: "clarifies" },  // RACI Matrix → Org Chart
                { from: 139, to: 8, type: "feeds_into", label: "guides" },     // Decision Framework → Strategic Plan
                { from: 8, to: 23, type: "feeds_into", label: "guides" },      // Strategic Plan → Operational Plan
                { from: 23, to: 22, type: "feeds_into", label: "supports" },   // Operational Plan → Annual Plan
                { from: 179, to: 101, type: "feeds_into", label: "defines" },  // Mission Success Criteria → Performance Framework
                { from: 152, to: 1, type: "feeds_into", label: "amplifies" },  // Impact Manifesto → Mission
                { from: 151, to: 3, type: "related_to", label: "" }            // Culture Code ↔ Core Values
            ]
        };

        /**
         * Initialize vis.js Network Graph
         *
         * This section configures and renders the interactive network visualization.
         */

        // Get the HTML container element
        const container = document.getElementById('networkContainer');

        /**
         * Configure node appearance
         *
         * Each node is styled based on its group (category):
         * - foundation: Red background (#e74c3c)
         * - governance: Blue background (#3498db)
         * - operations: Green background (#27ae60)
         * - performance: Orange background (#f39c12)
         *
         * All nodes have:
         * - Box shape with margin for text padding
         * - Dark border (#2c3e50)
         * - Orange highlight on hover/select
         */
        /**
         * Color scheme for artifact categories (12 distinct categories)
         */
        const categoryColors = {
            'foundation': '#e74c3c',        // Red - Mission, Vision, Values
            'strategic': '#9b59b6',         // Purple - Strategic Plans, Goals
            'governance': '#3498db',        // Blue - Bylaws, Board, Ethics
            'operations': '#27ae60',        // Green - Operating Model, Processes
            'workforce': '#1abc9c',         // Teal - HR, Talent, DEI
            'financial': '#f39c12',         // Gold - Budgets, Capital
            'technology': '#00acc1',        // Cyan - IT, Data, Cyber
            'risk': '#e67e22',              // Dark Orange - Risk, Continuity
            'communications': '#ec407a',    // Pink - Comms, Brand
            'performance': '#ff9800',       // Orange - KPIs, Evaluation
            'change': '#ffc107',            // Amber - Change, Culture
            'sector_specific': '#34495e',   // Navy - Public/Nonprofit specific
            'specialized': '#95a5a6',       // Gray - Consulting, Advanced Tools
            'cross_functional': '#7b1fa2'   // Deep Purple - Cross-domain artifacts
        };

        const nodes = new vis.DataSet(artifactRelationships.nodes.map(node => ({
            ...node,
            shape: 'box',
            margin: 10,
            font: { size: 12, multi: true },
            color: {
                background: categoryColors[node.group] || '#95a5a6',
                border: '#2c3e50',
                highlight: {
                    background: '#ff5722',
                    border: '#e64a19'
                }
            }
        })));

        /**
         * Configure edge (connection) appearance
         *
         * Edges are color-coded by relationship type:
         * - feeds_into: Green (#27ae60) - Shows directional flow
         * - depends_on: Blue (#3498db) - Shows dependencies
         * - related_to: Orange (#f39c12) - Shows complementary relationships
         *
         * All edges have:
         * - Directional arrows pointing to target
         * - Curved lines for better visibility
         */
        const edges = new vis.DataSet(artifactRelationships.edges.map(edge => ({
            ...edge,
            arrows: 'to',
            color: edge.type === 'feeds_into' ? '#27ae60' :
                   edge.type === 'depends_on' ? '#3498db' :
                   '#f39c12',
            smooth: { type: 'curvedCW', roundness: 0.2 }
        })));

        // Combine nodes and edges into dataset
        const data = { nodes, edges };

        /**
         * vis.js Network Configuration Options
         *
         * Physics: Enables dynamic layout with hierarchical repulsion
         * - Nodes push away from each other for clarity
         * - Spring forces keep connected nodes closer
         * - Stabilization runs 1000 iterations on initial load
         *
         * Layout: Hierarchical top-down arrangement
         * - Direction: UD (up-down, top to bottom)
         * - Level separation: 150px vertical spacing
         * - Node spacing: 200px horizontal spacing
         * - Sorted by directed edges (dependencies flow downward)
         *
         * Interaction: User controls
         * - Hover effects enabled
         * - Navigation buttons for zoom/pan
         * - Keyboard shortcuts enabled
         *
         * @see https://visjs.github.io/vis-network/docs/network/
         */
        const options = {
            physics: {
                enabled: true,
                hierarchicalRepulsion: {
                    centralGravity: 0.3,
                    springLength: 150,
                    springConstant: 0.01,
                    nodeDistance: 180,
                    damping: 0.09
                },
                solver: 'hierarchicalRepulsion',
                stabilization: {
                    enabled: true,
                    iterations: 1000
                }
            },
            layout: {
                hierarchical: {
                    enabled: true,
                    direction: 'UD',
                    sortMethod: 'directed',
                    levelSeparation: 150,
                    nodeSpacing: 200
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 100,
                navigationButtons: true,
                keyboard: true
            }
        };

        // Create the network visualization
        const network = new vis.Network(container, data, options);

        /**
         * Event Handlers
         */

        /**
         * Handle node click events
         *
         * When user clicks on an artifact node, display detailed information
         * in the side panel including:
         * - Artifact name and number
         * - Category (group)
         * - Hierarchical level
         * - Link back to main catalog
         */
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                showArtifactInfo(node);
            }
        });

        /**
         * Display artifact information in side panel
         *
         * Shows details for the clicked artifact and provides navigation
         * back to the main catalog with anchor link to specific artifact.
         *
         * @param {Object} node - The vis.js node object containing artifact data
         */
        function showArtifactInfo(node) {
            const panel = document.getElementById('infoPanel');
            const content = document.getElementById('infoPanelContent');

            content.innerHTML = `
                <h2>${node.label.replace('\\n', ' ')}</h2>
                <span class="artifact-number">#${node.id}</span>
                <p><strong>Category:</strong> ${node.group}</p>
                <p><strong>Hierarchy Level:</strong> ${node.level}</p>
                <br>
                <p><em>Click on connected nodes to explore relationships</em></p>
                <br>
                <a href="index.html#artifact-${node.id}" class="btn btn-primary" style="color: white;">View in Catalog</a>
            `;

            panel.classList.add('show');
        }

        /**
         * Close the information panel
         *
         * Hides the side panel when user clicks the close button
         * or wants to return to exploring the graph.
         */
        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('show');
        }

        /**
         * Toggle physics engine on/off
         *
         * Physics creates the dynamic, spring-based layout where nodes
         * repel each other and edges act like springs.
         *
         * Reasons to toggle physics:
         * - Turn OFF: Freeze the layout for easier reading/screenshots
         * - Turn ON: Let graph reorganize after adding/removing filters
         *
         * @global {boolean} physicsEnabled - Tracks current physics state
         */
        let physicsEnabled = true;
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            network.setOptions({ physics: { enabled: physicsEnabled } });
        }

        function resetNetwork() {
            network.fit();
            network.setOptions({ physics: { enabled: true } });
            physicsEnabled = true;
        }

        function fitNetwork() {
            network.fit({ animation: true });
        }

        /**
         * Filter nodes by checked categories
         *
         * Shows/hides nodes based on which category checkboxes are selected.
         * Also hides edges that connect to hidden nodes.
         */
        function filterCategories() {
            const checkboxes = document.querySelectorAll('.category-filter input[type="checkbox"]');
            const selectedCategories = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            // Update node visibility
            nodes.forEach(node => {
                const shouldShow = selectedCategories.includes(node.group);
                nodes.update({ id: node.id, hidden: !shouldShow });
            });

            // Update edge visibility (hide edges if either end is hidden)
            edges.forEach(edge => {
                const fromNode = nodes.get(edge.from);
                const toNode = nodes.get(edge.to);
                const shouldShow = fromNode && toNode &&
                                 selectedCategories.includes(fromNode.group) &&
                                 selectedCategories.includes(toNode.group);
                edges.update({ id: edge.id, hidden: !shouldShow });
            });

            network.fit();
        }

        /**
         * Toggle all category checkboxes on/off
         */
        function toggleAllCategories() {
            const checkboxes = document.querySelectorAll('.category-filter input[type="checkbox"]');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            checkboxes.forEach(cb => {
                cb.checked = !allChecked;
            });

            filterCategories();
        }

        /**
         * Master View - Shows only essential foundational artifacts
         *
         * Displays the "Universal Artifact Stack" - the bare minimum artifacts
         * that every organization needs regardless of size, sector, or complexity.
         *
         * Essential artifacts include:
         * - Strategic Foundation: Mission, Vision, Values, Purpose, Goals
         * - Core Governance: Charter, Bylaws, Board, Ethics, Controls
         * - Planning: Strategic Plan, Annual Plan
         * - Operations: Operating Model, Org Structure
         * - Financial: Annual Budget
         * - Performance: Performance Framework, KPIs
         */
        function showMasterView() {
            // Essential artifact IDs that form the universal stack
            const masterArtifacts = [
                1,   // Mission Statement
                2,   // Vision Statement
                3,   // Core Values
                4,   // Purpose Statement
                5,   // Strategic Goals
                8,   // Strategic Plan
                10,  // Strategic Plan (original)
                11,  // Bylaws
                12,  // Board Charter
                14,  // Organizational Narrative
                15,  // Code of Ethics
                16,  // Governance Framework
                20,  // Internal Controls Framework
                22,  // Annual Plan
                31,  // Operating Model
                34,  // Org Structure
                59,  // Org Chart
                65,  // Annual Budget
                101, // Performance Framework
                104  // KPIs
            ];

            // Hide all nodes first
            nodes.forEach(node => {
                const shouldShow = masterArtifacts.includes(node.id);
                nodes.update({ id: node.id, hidden: !shouldShow });
            });

            // Show only edges between visible master artifacts
            edges.forEach(edge => {
                const fromVisible = masterArtifacts.includes(edge.from);
                const toVisible = masterArtifacts.includes(edge.to);
                const shouldShow = fromVisible && toVisible;
                edges.update({ id: edge.id, hidden: !shouldShow });
            });

            // Update checkboxes to reflect the visible categories
            const checkboxes = document.querySelectorAll('.category-filter input[type="checkbox"]');
            checkboxes.forEach(cb => {
                // Check foundation, strategic, governance, operations, financial, performance
                const masterCategories = ['foundation', 'strategic', 'governance', 'operations', 'financial', 'performance'];
                cb.checked = masterCategories.includes(cb.value);
            });

            network.fit({ animation: true });

            // Show notification
            alert('⭐ Master View: Showing 20 essential foundational artifacts\n\nThese are the core artifacts every organization needs:\n• Strategic Foundation (Mission, Vision, Values, Purpose, Goals)\n• Core Governance (Charter, Bylaws, Board, Ethics, Controls)\n• Planning (Strategic Plan, Annual Plan)\n• Operations (Operating Model, Org Structure)\n• Financial (Annual Budget)\n• Performance (Framework, KPIs)\n\nClick "Reset View" to see all artifacts again.');
        }

        // Add event listeners to category checkboxes
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.category-filter input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', filterCategories);
            });
        });

        function filterByCategory() {
            const category = document.getElementById('filterCategory').value;

            if (category === 'all') {
                nodes.forEach(node => {
                    nodes.update({ id: node.id, hidden: false });
                });
                edges.forEach(edge => {
                    edges.update({ id: edge.id, hidden: false });
                });
            } else {
                nodes.forEach(node => {
                    nodes.update({
                        id: node.id,
                        hidden: node.group !== category
                    });
                });

                // Hide edges where both nodes are hidden
                edges.forEach(edge => {
                    const fromNode = nodes.get(edge.from);
                    const toNode = nodes.get(edge.to);
                    edges.update({
                        id: edge.id,
                        hidden: fromNode.group !== category && toNode.group !== category
                    });
                });
            }

            network.fit();
        }

        // Initialize
        console.log('🕸️ Artifact Relationship Map loaded');
        console.log(`Showing ${nodes.length} artifacts with ${edges.length} relationships`);
    </script>
